name: README build

on:
  schedule:
    - cron: "0 4 1 * *" # 1st of every month, 04:00 UTC (09:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit and push
        run: |
          git config user.name "CoderSwarup/GitHub-Actions-Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add -A
          git commit -m "Updated README" || echo "No changes to commit"
          git push
